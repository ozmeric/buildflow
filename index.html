<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BuildFlow Demo</title>
<meta name="theme-color" content="#0B1B33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: navy app chrome (header + sidebar) framing a white working canvas; gold marks what is active and everything the AI does. */
:root{
  --navy:#0B1B33; --navy-2:#13294A; --navy-3:#1F3B63; --navy-ink:#C3CFE2; --navy-mute:#7F93B3;
  --gold:#C9A227; --gold-2:#E3C566; --gold-soft:#FBF4DF; --gold-ink:#7A5E0C;
  --paper:#F3F5F9; --white:#FFFFFF; --ink:#0E1A2B; --muted:#5A6A81; --line:#E1E6EE; --line-2:#EEF1F6;
  --ok:#157A3C; --ok-bg:#E5F3EA; --warn:#A6580A; --warn-bg:#FCF0DC; --bad:#B42121; --bad-bg:#FBE8E8; --info:#1E4FC2; --info-bg:#E6EDFB;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#root{height:100%}
.app{display:flex;flex-direction:column;height:100%}

/* Header */
.hdr{height:62px;flex-shrink:0;background:var(--navy);border-bottom:1px solid var(--navy-3);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-ic{width:36px;height:36px;flex-shrink:0;border-radius:9px;background:var(--gold);color:var(--navy);font-family:var(--display);font-weight:700;font-size:19px;display:grid;place-items:center}
.brand-name{color:#fff;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-r{display:flex;align-items:center;gap:12px;flex-shrink:0}
.demo-chip{display:flex;align-items:center;gap:8px;border:1px solid rgba(201,162,39,.45);color:var(--gold-2);border-radius:999px;padding:4px 6px 4px 12px;font-size:12px;font-weight:600}
.demo-chip button{background:var(--navy-2);border:1px solid var(--navy-3);color:var(--navy-ink);border-radius:999px;padding:3px 10px;font-size:11.5px;cursor:pointer}
.demo-chip button:hover{color:#fff}
.bf-logo{height:34px;width:auto;display:block}

/* Shell */
.shell{flex:1;display:flex;min-height:0}
.side{width:240px;flex-shrink:0;background:var(--navy);overflow-y:auto;padding:12px 10px 16px;display:flex;flex-direction:column}
.side-label{color:var(--navy-mute);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;padding:16px 10px 6px}
.side-label.ai{color:var(--gold-2);display:flex;align-items:center;gap:6px}
.si{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;color:var(--navy-ink);cursor:pointer;font-size:13.5px;font-weight:500}
.si:hover{background:var(--navy-2);color:#fff}
.si.on{background:var(--navy-2);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.si.sub{padding:7px 10px 7px 38px;font-size:12.5px;color:var(--navy-mute)}
.si.sub.on,.si.sub:hover{color:#fff}
.si .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.si .cnt{margin-left:auto;background:var(--gold);color:var(--navy);border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
.si .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot{margin-top:auto;padding:18px 10px 4px;color:var(--navy-mute);font-size:11px;line-height:1.5}
.side-foot b{color:var(--gold-2);font-weight:600}
.main{flex:1;overflow-y:auto;min-width:0}
.wrap{max-width:1200px;margin:0 auto;padding:26px 26px 48px}

/* Type + common */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.ph-t{min-width:0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.eyebrow.gold{color:var(--gold-ink)}
h1.t{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.15;margin:0;letter-spacing:-.015em;text-wrap:balance}
h2.t{font-family:var(--display);font-weight:600;font-size:19px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin-top:5px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g-split{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);align-items:start}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-proj{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kpi .l{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .v{font-family:var(--display);font-size:27px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .n{font-size:12.5px;color:var(--muted);margin-top:3px}
.kpi .n.bad{color:var(--bad)} .kpi .n.ok{color:var(--ok)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--gold);color:var(--navy);border:1px solid var(--gold);border-radius:8px;padding:9px 15px;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--gold-2);border-color:var(--gold-2)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.navy:hover{background:var(--navy-2)}
.btn.ghost{background:var(--white);border-color:var(--line);color:var(--ink);font-weight:600}
.btn.ghost:hover{border-color:var(--navy-mute)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.lnk{background:none;border:0;padding:0;color:var(--info);font-weight:600;cursor:pointer;font-size:13px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px;display:grid;place-items:center}
.x:hover{background:var(--line-2);color:var(--bad)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;border:0;line-height:1.6}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--info)}
.pill.mute{background:var(--line-2);color:var(--muted)} .pill.gold{background:var(--gold-soft);color:var(--gold-ink)}
.pill.navy{background:var(--navy);color:#fff}
button.pill{cursor:pointer}
.bar{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--navy);border-radius:99px}
.bar>i.gold{background:var(--gold)} .bar>i.bad{background:var(--bad)} .bar>i.ok{background:var(--ok)}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line-2);min-width:0}
.lrow:first-child{border-top:0}
.lrow .grow{flex:1;min-width:0}
.lrow .tt{font-weight:600}
.lrow .mt{font-size:12.5px;color:var(--muted);margin-top:2px}
.over{color:var(--bad);font-weight:600}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}

.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px;scrollbar-width:none}
.tab{padding:10px 14px;border:0;background:none;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;color:var(--ink);background:var(--white)}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.18)}
.f{display:grid;gap:5px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;min-width:0}
.f input,.f select,.f textarea{text-transform:none;letter-spacing:0;font-weight:400;font-size:14px}
.form{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.form .full{grid-column:1/-1}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}

/* AI surfaces */
.aibox{background:var(--navy);color:#fff;border-radius:14px;padding:22px;position:relative;overflow:hidden;border:1px solid var(--navy-3)}
.aibox::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,39,.22),transparent 70%);pointer-events:none}
.ai-tag{display:inline-flex;align-items:center;gap:6px;color:var(--gold-2);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.aibox h2.t{color:#fff;margin-top:8px}
.aibox ul{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px;position:relative;z-index:1}
.aibox li{display:flex;gap:10px;align-items:flex-start;color:var(--navy-ink)}
.aibox li b{color:#fff;font-weight:600}
.aibox li .mk{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;background:var(--gold)}
.aibox li .mk.bad{background:#F07A7A} .aibox li .mk.ok{background:#6FCF97}
.aibox li .lnk{color:var(--gold-2);margin-left:4px;font-size:12.5px}
.aibox .btn.ghost{background:transparent;color:#fff;border-color:var(--navy-3)}
.spark{color:var(--gold)}

.feed{display:grid;gap:0}
.feed .lrow .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;background:var(--gold-soft);color:var(--gold-ink)}

/* Projects */
.pcard{cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:border-color .15s,transform .15s;text-align:left;font:inherit}
.pcard:hover{border-color:var(--gold);transform:translateY(-1px)}
.pcard .nm{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.25}
.pcard .meta{font-size:12.5px;color:var(--muted)}
.pcard .fig{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.pcard .fig b{color:var(--ink);font-variant-numeric:tabular-nums}
.phead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.cat-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:12px;align-items:center;padding:7px 0;font-size:13px}
.cat-row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Tasks */
.trow .chk{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);background:var(--white);display:grid;place-items:center;cursor:pointer;flex-shrink:0;color:#fff}
.trow .chk.on{background:var(--ok);border-color:var(--ok)}
.trow.done .tt{text-decoration:line-through;color:var(--muted)}

/* Timeline */
.tl{position:relative;display:grid;gap:4px}
.tl-i{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;position:relative;padding-bottom:18px}
.tl-i::before{content:"";position:absolute;left:16px;top:30px;bottom:0;width:2px;background:var(--line)}
.tl-i:last-child::before{display:none}
.tl-dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--white);display:grid;place-items:center;cursor:pointer;color:transparent}
.tl-dot.on{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.tl-dot.next{border-color:var(--gold)}

/* Table */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right}

/* Quotes */
.qitem + .qitem{margin-top:16px}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line-2)}
.qrow.acc{background:linear-gradient(90deg,var(--gold-soft),transparent);margin:0 -18px;padding:11px 18px}

/* Vendors */
.vcard .nm{font-weight:700;font-size:15px}
.vcard .ct{display:grid;gap:3px;font-size:13px;margin-top:10px;user-select:text}
.stars{color:var(--gold);font-weight:700;font-size:12.5px}

/* Leads */
.auto{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.auto .grow{flex:1;min-width:220px}
.sw{width:50px;height:28px;border-radius:999px;background:var(--line);border:0;position:relative;cursor:pointer;flex-shrink:0;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.sw.on{background:var(--gold)}
.sw.on i{left:25px}
.inbox{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:16px;align-items:start}
.ilist{padding:6px}
.irow{display:block;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:12px;cursor:pointer;border-left:3px solid transparent}
.irow:hover{background:var(--paper)}
.irow.on{background:var(--paper);border-left-color:var(--gold)}
.irow .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.irow .nm{font-weight:700}
.irow .tm{font-size:11.5px;color:var(--muted);white-space:nowrap}
.irow .ms{font-size:12.5px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.irow .row{margin-top:7px}
.bubble{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;white-space:pre-wrap;line-height:1.55}
.bubble.ai{background:var(--gold-soft);border-color:#EEDDA6}
.writing{display:inline-flex;gap:4px;align-items:center}
.writing i{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:blink 1s infinite}
.writing i:nth-child(2){animation-delay:.15s}.writing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.kan{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--line-2);border-radius:12px;padding:10px;min-height:120px}
.kcol-h{display:flex;justify-content:space-between;align-items:baseline;padding:4px 4px 10px;font-weight:700;font-size:13px}
.kcol-h span{font-weight:600;color:var(--muted);font-size:12px}
.kcard{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:8px}
.kcard select{margin-top:8px;padding:5px 8px;font-size:12.5px}

/* Social */
.f .seg{justify-self:start;max-width:100%;overflow-x:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--white);padding:8px 14px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.mock{background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden;max-width:440px;margin:0 auto;width:100%}
.mock-h{display:flex;align-items:center;gap:10px;padding:12px 14px}
.mock-h .av{width:36px;height:36px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-family:var(--display);font-weight:700}
.mock-h .nm{font-weight:700;font-size:13.5px}
.mock-h .tm{font-size:11.5px;color:var(--muted)}
.mock-cap{padding:0 14px 12px;white-space:pre-wrap;font-size:13.5px;line-height:1.5}
.mock-cap.ig{padding:10px 14px 14px}
.mock-f{display:flex;justify-content:space-around;border-top:1px solid var(--line-2);padding:9px;font-size:12.5px;font-weight:600;color:var(--muted)}
.pimg{position:relative;aspect-ratio:1.4/1;max-width:100%;overflow:hidden;background:var(--navy);color:#fff;display:flex}
.pimg.sq{aspect-ratio:1/1}
.pimg .half{flex:1;position:relative;display:flex;align-items:flex-end;padding:14px}
.pimg .before{background:repeating-linear-gradient(135deg,#5B6372 0 10px,#535A68 10px 20px);filter:saturate(.6)}
.pimg .after{background:linear-gradient(160deg,#F1E3B8 0%,#D9B85C 45%,#1F3B63 100%)}
.pimg .lbl{background:rgba(11,27,51,.82);color:#fff;font-size:11px;font-weight:700;letter-spacing:.14em;padding:5px 9px;border-radius:5px}
.pimg .after .lbl{background:var(--gold);color:var(--navy)}
.pimg .center{flex:1;display:flex;flex-direction:column;justify-content:center;padding:26px;background:radial-gradient(circle at 85% 15%,rgba(201,162,39,.35),transparent 55%),var(--navy)}
.pimg .center .k{color:var(--gold-2);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.pimg .center .h{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.1;margin-top:8px}
.pimg .center .s{color:var(--navy-ink);font-size:13px;margin-top:10px}
.pimg .center .rule{width:44px;height:3px;background:var(--gold);margin-top:14px}
.pimg .wm{position:absolute;right:12px;top:10px;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.85);text-transform:uppercase}

/* Chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 62px - 150px);min-height:420px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 2px 12px}
.msg{max-width:min(620px,88%);padding:12px 15px;border-radius:14px;line-height:1.55}
.msg.me{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--white);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg p{margin:0}
.msg p + p{margin-top:6px}
.msg .li{display:flex;gap:8px;margin-top:5px}
.msg .li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);margin-top:8px;flex-shrink:0}
.composer{display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.composer input{flex:1}

/* Modal + toast */
.mbg{position:fixed;inset:0;background:rgba(11,27,51,.55);display:grid;place-items:center;z-index:60;padding:16px}
.modal{background:var(--white);border-radius:14px;width:min(540px,100%);max-height:calc(100% - 32px);overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(11,27,51,.35)}
.modal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;z-index:70;display:flex;gap:9px;align-items:center;box-shadow:0 10px 30px rgba(11,27,51,.3);font-weight:500;max-width:calc(100% - 32px)}
.toast .spark{flex-shrink:0}

/* Mobile */
.bnav{display:none}
.mobile-only{display:none}
@media (max-width:1000px){.g-split{grid-template-columns:minmax(0,1fr)}.inbox{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .side{display:none}
  .mobile-only{display:revert}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--navy);border-top:1px solid var(--navy-3);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:40}
  .bnav button{flex:1;background:none;border:0;color:var(--navy-mute);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;padding:5px 0;cursor:pointer}
  .bnav button.on{color:var(--gold-2)}
  .wrap{padding:18px 16px 96px}
  h1.t{font-size:24px}
  .hdr{padding:0 14px;height:58px}
  .brand-name{font-size:17px}
  .bf-logo{height:26px}
  .demo-chip span{display:none}
  .demo-chip{padding:3px}
  .g-2,.form{grid-template-columns:minmax(0,1fr)}
  .chat{height:calc(100vh - 58px - 200px)}
  .inbox.has-sel .ilist-card{display:none}
  .inbox:not(.has-sel) .idetail{display:none}
  .cat-row{grid-template-columns:minmax(0,110px) minmax(0,1fr) auto}
}
@media (max-width:480px){.bf-logo{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Live mode */
.live-chip{display:flex;align-items:center;gap:7px;border:1px solid rgba(111,207,151,.45);color:#9FE2B9;border-radius:999px;padding:4px 6px 4px 11px;font-size:12px;font-weight:600}
.live-chip .ld{width:7px;height:7px;border-radius:50%;background:#6FCF97;box-shadow:0 0 0 3px rgba(111,207,151,.2)}
.live-chip button{background:var(--navy-2);border:1px solid var(--navy-3);color:var(--navy-ink);border-radius:999px;padding:3px 10px;font-size:11.5px;cursor:pointer}
.pin-wrap{flex:1;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(circle at 80% 10%,rgba(201,162,39,.18),transparent 45%),var(--navy)}
.pin-card{background:var(--white);border-radius:16px;padding:28px;width:min(380px,100%);display:grid;gap:14px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.pin-card input{font-size:22px;letter-spacing:.4em;text-align:center;font-variant-numeric:tabular-nums}
.err{color:var(--bad);font-size:13px}
.qr{display:grid;place-items:center;padding:16px;background:var(--white);border:1px solid var(--line);border-radius:12px}
.qr img,.qr canvas{display:block;max-width:100%}
.url-box{display:flex;gap:8px;align-items:center}
.url-box code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12.5px;user-select:all}
.photo-pick{display:flex;align-items:center;gap:12px;border:1px dashed var(--line);border-radius:10px;padding:10px;cursor:pointer}
.photo-pick:hover{border-color:var(--gold)}
.photo-pick img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.photo-pick input{display:none}
.pimg-photo{display:block;width:100%;height:auto;max-width:100%}
.prow{cursor:pointer;border-radius:8px}
.prow:hover{background:var(--paper)}
.ba-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ba-slot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:4/3;border:1px dashed var(--line);border-radius:10px;cursor:pointer;overflow:hidden;background:var(--paper);color:var(--muted);font-size:12.5px;font-weight:600;text-align:center}
.ba-slot:hover{border-color:var(--gold)}
.ba-slot input{display:none}
.ba-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ba-slot .tag{position:absolute;left:8px;bottom:8px;font-size:10.5px;font-weight:700;letter-spacing:.12em;padding:4px 8px;border-radius:5px;background:rgba(11,27,51,.85);color:#fff}
.ba-slot .tag.after{background:var(--gold);color:var(--navy)}
.ba-slot .x{position:absolute;right:6px;top:6px;background:rgba(255,255,255,.92)}
.pimg-photo.sq{aspect-ratio:1/1;object-fit:cover}
.note{font-size:12.5px;color:var(--muted)}
.note.bad{color:var(--bad)}
a.lnk{text-decoration:none}
.cal-day{display:grid;grid-template-columns:76px minmax(0,1fr);gap:16px;padding:14px 4px;border-top:1px solid var(--line-2)}
.cal-day:first-child{border-top:0}
.cal-day .dl{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.cal-day .wd{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.cal-day .dn{font-family:var(--display);font-size:26px;font-weight:600;line-height:1}
.cal-day.today .dn{color:var(--gold-ink)}
.ev{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;text-align:left;font:inherit;color:inherit;background:var(--white);border:1px solid var(--line);border-left:3px solid var(--navy);border-radius:10px;padding:10px 12px;cursor:pointer}
.ev:hover{border-color:var(--gold);border-left-color:var(--navy)}
.ev .tm{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.ev .gs{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.ev .gs .pill{white-space:normal;overflow-wrap:anywhere;text-align:left}
.f .chips,.f .chip{text-transform:none;letter-spacing:0}
.ms-mark{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:inherit;font-size:12.5px;font-weight:600;color:var(--gold-ink);background:var(--gold-soft);border:1px dashed #E6CF86;border-radius:8px;padding:6px 10px;cursor:pointer}
@media (max-width:820px){ .cal-day{grid-template-columns:52px minmax(0,1fr);gap:10px} .ev{grid-template-columns:62px minmax(0,1fr)} .ev > a,.ev > span:last-child{display:none} }
.acard{margin-top:10px;border:1px solid #EEDDA6;background:var(--gold-soft);border-radius:10px;padding:12px 12px 10px}
.aitem{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:13.5px;line-height:1.45}
.aitem.off{color:var(--muted);text-decoration:line-through}
.aitem .lnk{margin-left:auto;font-size:12.5px;flex-shrink:0}
.aic{width:22px;height:22px;border-radius:6px;background:var(--white);display:grid;place-items:center;color:var(--gold-ink);flex-shrink:0}
</style>

/* Shrink photos in the browser before upload so posts stay fast */
function resizePhoto(file){
  return new Promise((ok,fail)=>{
    const r = new FileReader();
    r.onerror = () => fail(new Error("Couldn't read that file."));
    r.onload = () => { const img = new Image(); img.onerror = () => fail(new Error("That file isn't a supported image."));
      img.onload = () => { const max=1600, s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height); ok(c.toDataURL("image/jpeg",0.86)); };
      img.src = r.result; };
    r.readAsDataURL(file);
  });
}

function nextSlots(){
  const out=[]; let d=2;
  while(out.length<2){ const dt=new Date(T0.getTime()+d*DAY); const wd=dt.getDay(); if(wd>0 && wd<6) out.push(dt.toLocaleDateString("en-US",{weekday:"long"})+", "+dt.toLocaleDateString("en-US",{month:"short",day:"numeric"})); d++; }
  return out[0]+" at 10 AM or "+out[1]+" at 2 PM";
}
function genReply(lead,variant){
  const svc = lead.service.toLowerCase();
  const msg = (lead.message||"").toLowerCase();
  const extra = [];
  if(/budget|\$\d|\dk\b/.test(msg)) extra.push("Thanks for sharing your budget range. It helps us show you options that make the most of it.");
  if(/asap|soon|how soon|quick|start/.test(msg)) extra.push("Right now we can typically begin within three to four weeks of signing.");
  if(/free estimate|estimate|quote/.test(msg)) extra.push("Estimates are always free, and you'll get a written, itemized proposal after the visit.");
  return `Hi ${first(lead.name)},\n\n${pick(OPENERS,variant)(lead,svc)} ${SERVICE_LINE[lead.service]||""}${extra.length?" "+extra.join(" "):""}\n\nThe next step is a free on-site consultation, about 45 minutes, where we measure, talk through your goals, and go over budget ranges. I have openings ${nextSlots()}. ${pick(CLOSERS,variant)}\n\nBest,\n${CONFIG.ownerName}\n${CONFIG.companyName}\n${CONFIG.phone}`;

    open.forEach(p=>{ const m=nextMilestone(db,p.id); L.push(`• **${p.name}**: ${m? m.title+", "+whenLabel(m.date) : "all milestones complete"}. Project wraps ${fmtD(p.end)}.`); });

  if(has("post","social","facebook","instagram","marketing")){

    L.push(`• Tasks: ${done} of ${ts.length} done${od.length?", "+od.length+" overdue":""}`);
    L.push(`• Next milestone: ${m? m.title+", "+whenLabel(m.date) : "none, all complete"}`);
    L.push(`• Projected profit: ${money(proj.contract-Math.max(proj.budget,sp))}`);
    return L;
  }
  return brief(db).map(b=>"• "+b.text.replace(/<\/?b>/g,"**")).concat(["Try asking about budgets, overdue tasks, leads, quotes, or a project by name, like \"How is Hawthorne going?\""]).reduce((a,x,i)=>i===0?["Here's today's rundown:",x]:a.concat([x]),[]);
}

function nextRunLocal(cfg){

const validDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s||"");

function describeAction(db,a){
  const P = projById(db,a.projectId), M = db.milestones.find(m=>m.id===a.milestoneId), T = db.tasks.find(t=>t.id===a.taskId), V = db.vendors.find(v=>v.id===a.vendorId);

      return {ok:true,icon:"plus",text:`Add ${money(+a.amount)} expense to ${P.name} · ${oneOf(a.category,CONFIG.expenseCategories,"Miscellaneous")}${a.vendor?" · "+a.vendor:""}${a.notes?" · "+a.notes:""}`,go:["project",P.id,"expenses"]};
    case "addMilestone":
      if(!P) return bad("Add a milestone: project not found");

      return {ok:true,icon:"flag",text:`Add milestone "${a.title}" to ${P.name} on ${fmtD(a.date)}`,go:["project",P.id,"planning"]};
    case "updateMilestone": {
      if(!M) return bad("Update a milestone: milestone not found");
      const parts = [];
      if(validDate(a.date) && a.date!==M.date) parts.push("move from "+fmtD(M.date)+" to "+fmtD(a.date));
      if(a.title && a.title!==M.title) parts.push(`rename to "${a.title}"`);
      if(typeof a.done==="boolean" && a.done!==M.done) parts.push(a.done?"mark done":"mark not done");
      if(!parts.length) return bad(`"${M.title}": nothing to change`);
      return {ok:true,icon:"flag",text:`Milestone "${M.title}" (${projById(db,M.projectId).area}): ${parts.join(", ")}`,go:["project",M.projectId,"planning"]};
    }
    case "addTask":
      if(!P) return bad("Add a task: project not found");
      if(!a.task) return bad("Add a task: task text missing");
      return {ok:true,icon:"check",text:`Add task "${a.task}" to ${P.name}${validDate(a.due)?", due "+fmtD(a.due):""}${a.assignee?", for "+a.assignee:""}`,go:["project",P.id,"tasks"]};
    case "updateTask": {
      if(!T) return bad("Update a task: task not found");
      const parts = [];
      if(a.status && a.status!==T.status && CONFIG.taskStatuses.indexOf(a.status)>-1) parts.push("status → "+a.status);
      if(validDate(a.due) && a.due!==T.due) parts.push("due → "+fmtD(a.due));
      if(a.assignee && a.assignee!==T.assignee) parts.push("assign to "+a.assignee);
      if(a.priority && a.priority!==T.priority && CONFIG.taskPriorities.indexOf(a.priority)>-1) parts.push("priority → "+a.priority);
      if(!parts.length) return bad(`"${T.task}": nothing to change`);
      return {ok:true,icon:"check",text:`Task "${T.task}": ${parts.join(", ")}`,go:["project",T.projectId,"tasks"]};
    }
    case "addVendor":
      if(!a.name) return bad("Add a vendor: name missing");
      return {ok:true,icon:"users",text:`Add vendor ${a.name} · ${oneOf(a.category,CONFIG.vendorCategories,"Other")}${a.phone?" · "+a.phone:""}${a.email?" · "+a.email:""}`,go:["vendors"]};
    case "updateVendor": {
      if(!V) return bad("Update a vendor: vendor not found");
      const parts = ["phone","email","category","notes"].filter(k=>a[k] && a[k]!==V[k]).map(k=>k+" → "+a[k]);
      if(!parts.length) return bad(`${V.name}: nothing to change`);
      return {ok:true,icon:"users",text:`Vendor ${V.name}: ${parts.join(", ")}`,go:["vendors"]};
    }
    case "addEvent": {
      const st = toISOFromLocal(a.start);
      if(!a.title || !st) return bad("Create an event: title or time missing");
      const en = a.end ? toISOFromLocal(a.end) : new Date(new Date(st).getTime()+(Number(a.durationMinutes)||60)*60000).toISOString();
      const gs = (a.guests||[]).filter(g=>/@/.test(g));
      return {ok:true,icon:"cal",text:`Create "${a.title}" · ${fmtEventTime(st,en)}${a.location?" · "+a.location:""}${gs.length?" · invite "+gs.map(g=>nameFor(db,g)).join(", "):""}`,go:["calendar"]};
    }
    case "updateEvent": {
      const E = (db.events||[]).find(x=>x.id===a.eventId);
      if(!E) return bad("Update an event: event not found");
      const parts = [];
      if(a.start){ const st=toISOFromLocal(a.start); if(st && st!==E.start) parts.push("move to "+fmtEventTime(st,new Date(new Date(st).getTime()+(Number(a.durationMinutes)||((new Date(E.end)-new Date(E.start))/60000))*60000).toISOString())); }
      else if(a.durationMinutes) parts.push("length "+a.durationMinutes+" min");
      if(a.title && a.title!==E.title) parts.push(`rename to "${a.title}"`);
      if(a.location && a.location!==E.location) parts.push("location → "+a.location);
      (a.addGuests||[]).forEach(g=>parts.push("invite "+nameFor(db,g)));
      (a.removeGuests||[]).forEach(g=>parts.push("remove "+nameFor(db,g)));
      if(!parts.length) return bad(`"${E.title}": nothing to change`);
      return {ok:true,icon:"cal",text:`Event "${E.title}": ${parts.join(", ")}${(E.guests||[]).length||(a.addGuests||[]).length?" · guests notified":""}`,go:["calendar"]};
    }
    case "cancelEvent": {
      const E = (db.events||[]).find(x=>x.id===a.eventId);
      if(!E) return bad("Cancel an event: event not found");
      return {ok:true,icon:"x",text:`Cancel "${E.title}" · ${fmtEventTime(E.start,E.end)}${(E.guests||[]).length?" · guests notified":""}`,go:["calendar"]};
    }
    default: return bad("Unsupported change: "+a.type);
  }
}
/* Calendar changes go through calOps (Google Calendar in live mode) and may take a moment */
function applyCalendarAction(ctx,a){

    const end = a.end ? toISOFromLocal(a.end) : new Date(new Date(start).getTime()+(Number(a.durationMinutes)||60)*60000).toISOString();
    return calOps.create({title:a.title,start,end,location:a.location||"",description:a.description||"",projectId:a.projectId||"",guests:(a.guests||[]).filter(g=>/@/.test(g))}, a.sendInvites!==false);
  }
  const E = (db.events||[]).find(x=>x.id===a.eventId);
  if(!E) return Promise.reject(new Error("That event is no longer on the calendar."));
  if(a.type==="cancelEvent") return calOps.remove(E.id,true);
  const ch = {};
  const len = Number(a.durationMinutes) || (new Date(E.end)-new Date(E.start))/60000;
  if(a.start){ const st=toISOFromLocal(a.start); ch.start=st; ch.end=new Date(new Date(st).getTime()+len*60000).toISOString(); }
  else if(a.durationMinutes){ ch.start=E.start; ch.end=new Date(new Date(E.start).getTime()+len*60000).toISOString(); }
  ["title","location","description"].forEach(k=>{ if(a[k]) ch[k]=a[k]; });
  if((a.addGuests||[]).length || (a.removeGuests||[]).length){
    const cur = (E.guests||[]).map(g=>g.email).filter(g=>(a.removeGuests||[]).map(x=>x.toLowerCase()).indexOf(g.toLowerCase())===-1);
    ch.guests = cur.concat((a.addGuests||[]).filter(g=>/@/.test(g) && cur.indexOf(g)===-1));
  }
  return calOps.update(E.id,ch,true);
}

const WD = {monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6,sunday:7,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6,sun:7};
const MON = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function parseWhen(s){
  s = s.toLowerCase(); let m;
  if((m = s.match(/\b(\d{4}-\d{2}-\d{2})\b/))) return m[1];
  if(/\btoday\b/.test(s)) return dOff(0);
  if(/\btomorrow\b/.test(s)) return dOff(1);
  if((m = s.match(/\bin (\d+|a|one|two|three) (day|days|week|weeks)\b/))){ const n = {a:1,one:1,two:2,three:3}[m[1]] || Number(m[1]); return dOff(n*(/week/.test(m[2])?7:1)); }

    const want = WD[m[2]], now = T0.getDay()===0?7:T0.getDay(); let d = (want-now+7)%7 || 7; if(m[1]==="next" && d<3) d += 7; return dOff(d);
  }
  if((m = s.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})\b/))){ let dt = new Date(T0.getFullYear(),MON[m[1]],Number(m[2])); if(dt < T0 - 60*DAY) dt = new Date(T0.getFullYear()+1,MON[m[1]],Number(m[2])); return iso(dt); }
  if((m = s.match(/\b(\d{1,2})\/(\d{1,2})\b/))) return iso(new Date(T0.getFullYear(),Number(m[1])-1,Number(m[2])));
  return null;
}
const words = s => s.toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>3);
function matchProject(db,s){ const t=s.toLowerCase(); return db.projects.find(p=>t.includes(p.area.toLowerCase()) || t.includes(p.name.toLowerCase().split(" ")[0]) || t.includes(p.client.toLowerCase().replace(/^the /,"").split(/[ &]/)[0])); }
function bestMatch(list,s,field){ const w=words(s); let best=null, score=0; list.forEach(x=>{ const sc=words(x[field]).filter(k=>w.indexOf(k)>-1).length; if(sc>score){score=sc;best=x;} }); return best ? {item:best,score} : null; }
const EXP_KEYS = [[/tile|lumber|drywall|material|supplies|paint\b|grout/,"Materials"],[/labor|crew|hours|wages/,"Labor"],[/plumb|electric|sub\b|subcontract|hvac/,"Subcontractors"],[/cabinet|counter|quartz|granite/,"Cabinets & Counters"],[/fixture|faucet|vanity|toilet|light/,"Fixtures"],[/permit|inspection fee/,"Permits & Fees"],[/dumpster|haul|demo/,"Demo & Hauling"],[/rent|rental|equipment|lift|scaffold/,"Equipment Rental"]];
const VEN_KEYS = [[/electric/,"Electrical"],[/plumb/,"Plumbing"],[/hvac|heating|air cond/,"HVAC"],[/drywall/,"Drywall"],[/tile|stone/,"Tile & Stone"],[/counter|quartz|granite/,"Countertops"],[/cabinet/,"Cabinets"],[/glass|mirror|shower door/,"Glass"],[/haul|dumpster|junk/,"Hauling"],[/supply|supplier|lumber|store/,"Supplier"],[/inspect/,"Inspector"]];
function parseCommand(db,text){
  const s = text.toLowerCase(), A = [], note = [];
  const ok = (msg) => ({answer:[msg,"Review the change below, then press Apply."],actions:A});
  // add vendor
  if(/\b(add|new|save)\b.*\b(vendor|sub|subcontractor|contractor|supplier)\b/.test(s)){
    const rest = text.replace(/^.*?\b(vendor|subcontractor|contractor|supplier|sub)\b[:\s]*/i,"");
    const phone = (rest.match(/\(?\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4}/)||[""])[0];
    const email = (rest.match(/[\w.+-]+@[\w-]+\.[\w.]+/)||[""])[0];
    const chunks = rest.split(/,/).map(x=>x.trim()).filter(Boolean);
    const name = (chunks[0]||"").replace(phone,"").replace(email,"").trim();
    const cat = (VEN_KEYS.find(([re])=>re.test(s))||[0,"Other"])[1];
    const notes = chunks.slice(1).filter(c=>c!==phone && c!==email && (cat==="Other" || !VEN_KEYS.some(([re])=>re.test(c.toLowerCase())))).join(", ");
    if(!name) return {answer:["What's the vendor's name? For example: Add vendor Blue Ridge Painting, painter, (804) 555-0170."],actions:[]};
    A.push({type:"addVendor",name,category:cat,phone,email,notes});
    return ok(`I'll add **${name}** to your vendors.`);
  }
  // add expense
  if(/\b(add|log|record|enter|spent|paid)\b/.test(s) && /(expense|spent|paid|cost|receipt|invoice|\$)/.test(s)){
    const m = s.match(/\$\s?([\d,]+(?:\.\d+)?)\s*(k)?\b/) || s.match(/\b([\d,]+(?:\.\d+)?)\s*(k)?\s*(dollars|bucks)\b/);
    const amount = m ? Number(m[1].replace(/,/g,""))*(m[2]?1000:1) : 0;
    const p = matchProject(db,text);
    if(!p) return {answer:["Which project is this expense for? "+openProjects(db).map(x=>x.area).join(", ")+"?"],actions:[]};
    if(!amount) return {answer:["How much was it? For example: Add a $450 tile expense to "+p.area+"."],actions:[]};
    const cat = (EXP_KEYS.find(([re])=>re.test(s))||[0,"Miscellaneous"])[1];
    const v = db.vendors.find(x=>s.includes(x.name.toLowerCase())) ;
    const fromM = text.match(/\bfrom ([A-Z][\w&' .-]+?)(?:\s+(?:for|to|at|on)\b|[,.]|$)/);
    const what = (text.match(/\$?[\d,.]+k?\s+(.+?)\s+expense/i)||[])[1] || (text.match(/\bfor (.+?)(?:\s+(?:to|at|on|from)\b|[,.]|$)/i)||[])[1] || "";
    A.push({type:"addExpense",projectId:p.id,amount,category:cat,vendor:v?v.name:(fromM?fromM[1].trim():""),date:parseWhen(text)||dOff(0),notes:what.replace(/^(a|an|the)\s+/i,"")});
    return ok(`I'll log **${money(amount)}** to ${p.name}.`);
  }
  // calendar: create
  const p = matchProject(db,text);
  if(!/\b(task|milestone|expense)\b/.test(s) && /\b(schedule|book|set up|setup|add|create|plan|put)\b.*\b(meeting|consultation|consult|walkthrough|walk-through|site visit|visit|call|inspection|appointment|event|review|delivery)\b/.test(s)){
    const date = parseWhen(text) || dOff(1), tm = parseTime(text) || "10:00";
    const who = findPerson(db,text);
    const kind = (s.match(/\b(consultation|consult|walkthrough|walk-through|site visit|call|inspection|meeting|review|appointment|delivery)\b/)||[])[1] || "meeting";
    const lab = ({consult:"Consultation","walk-through":"Walkthrough","site visit":"Site visit"})[kind] || kind[0].toUpperCase()+kind.slice(1);
    const title = lab+(who&&who.name!==who.email?" — "+who.name:p?" — "+p.area:"");
    const mins = (s.match(/\b(\d+)\s*(min|mins|minutes)\b/)||[])[1];
    const dur = mins ? Number(mins) : /\bhour\b/.test(s) ? 60 : /consult/.test(kind) ? 45 : 60;
    if(/\b(invite|with)\b/.test(s) && !who) return {answer:["Who should I invite? Give me their email, or a lead or vendor name that has one."],actions:[]};
    A.push({type:"addEvent",title,start:date+"T"+tm,durationMinutes:dur,location:p?p.address:"",guests:who&&who.email?[who.email]:[],projectId:p?p.id:"",sendInvites:true});
    return ok(`I'll put **${title}** on your calendar ${whenLabel(date)} at ${fmtClock(tm)}${who&&who.email?" and send "+who.name+" an invite":""}.`);
  }
  // calendar: change or cancel (only when an event matches better than a milestone or task)
  const evM = bestMatch(db.events||[],text,"title");
  const msPre = bestMatch(p ? db.milestones.filter(x=>x.projectId===p.id) : db.milestones,text,"title");
  const evWins = evM && (!msPre || evM.score > msPre.score || /\b(meeting|event|appointment|calendar|consult|visit|call|delivery|invite)\b/.test(s));
  if(evWins && /\b(cancel|delete|remove|call off)\b/.test(s) && !/\bremove\b.*\bfrom\b/.test(s)){
    A.push({type:"cancelEvent",eventId:evM.item.id});
    return ok(`I'll cancel **${evM.item.title}**${(evM.item.guests||[]).length?" and let the guests know":""}.`);
  }
  if(evWins && /\b(move|reschedule|push|change|shift|invite|add|bump)\b/.test(s)){

    if(date || tm){ const cur = new Date(evM.item.start); act.start = (date||iso(cur))+"T"+(tm||pad2(cur.getHours())+":"+pad2(cur.getMinutes())); }
    const who = findPerson(db,text);
    if(/\b(invite|add)\b/.test(s) && who && who.email) act.addGuests = [who.email];
    if(!act.start && !act.addGuests) return {answer:[`What should change about "${evM.item.title}"? A new day or time, or someone to invite?`],actions:[]};
    A.push(act);
    return ok(`I'll update **${evM.item.title}**.`);
  }
  // milestones
  const msPool = p ? db.milestones.filter(x=>x.projectId===p.id) : db.milestones;
  if(/\badd\b.*\bmilestone\b/.test(s)){
    if(!p) return {answer:["Which project should the milestone go on?"],actions:[]};
    const title = (text.match(/["“](.+?)["”]/)||[])[1] || (text.match(/milestone\s+(.+?)(?:\s+(?:to|for|on|by)\b|$)/i)||[])[1];
    const date = parseWhen(text);
    if(!title || !date) return {answer:["Give me a title and a date, like: Add milestone \"Final inspection\" to "+p.area+" on Nov 20."],actions:[]};
    A.push({type:"addMilestone",projectId:p.id,title:title.trim(),date});

    return ok(`I'll mark **${ms.title}** as done.`);
  }
  if(ms && /\b(move|push|reschedule|shift|change|delay|pull|set|slide)\b/.test(s)){
    const date = parseWhen(text);
    if(!date) return {answer:[`When should "${ms.title}" move to? For example: next Friday or Oct 30.`],actions:[]};

  if(/\badd\b.*\btask\b/.test(s)){

    const task = (text.match(/["“](.+?)["”]/)||[])[1] || (text.match(/task\s+(?:to\s+)?(.+?)(?:\s+(?:to|for|on|by|due)\s+(?:the\s+)?(?:[A-Z]|next|tomorrow|today|\d)|$)/i)||[])[1];

  }
  const tk = tkM && tkM.item;
  if(tk && /\b(mark|set)\b.*\b(done|complete|completed|finished)\b/.test(s)){
    A.push({type:"updateTask",taskId:tk.id,status:"Done"});
    return ok(`I'll mark **${tk.task}** as done.`);
  }
  return null;
}

const pad2 = n => String(n).padStart(2,"0");
